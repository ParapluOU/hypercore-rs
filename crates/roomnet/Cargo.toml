[package]
name = "roomnet"
version.workspace = true
edition.workspace = true
repository.workspace = true

# roomnet — a pluggable, sans-IO room-replication layer over the L1 substrate.
# The `Room` unit (autobase-ordered multiwriter log + rolling projections) is
# wasm-clean: no async, no I/O, no transport. Environment differences live behind
# three seams — Transport, StoreFactory/Store, ProjectionSink. The real Iroh
# transport + tokio driver are gated behind `iroh` (follow-on); the default build
# is portable and drives rooms synchronously (tests, browser).
[dependencies]
codec = { path = "../codec" }
merkle = { path = "../merkle" }
identity = { path = "../identity" }
storage = { path = "../storage" }
hypercore = { path = "../hypercore" }
autobase = { path = "../autobase" }

# Native Iroh transport + tokio driver. Optional so the default build stays
# wasm-clean + lightweight. iroh 1.x pins its own crypto tree, so no manual crypto
# pins are needed. NOTE: the `iroh` feature requires rustc >= 1.91 (iroh 1.x MSRV);
# the default build has no such requirement.
iroh = { version = "1", optional = true }
# iroh-gossip provides per-room peer discovery + address propagation (topic =
# RoomId): subscribing to a room's topic finds co-subscribers and teaches the
# endpoint their addresses, so the direct-dial sync path can reach them.
iroh-gossip = { version = "0.101", optional = true }
futures-lite = { version = "2", optional = true }

# WebSocket transport (feature `ws`, native + wasm). tokio-tungstenite-wasm speaks WS
# on both targets; `futures` supplies the channels + Stream/Sink combinators the
# sync Transport seam bridges the async socket with.
tokio-tungstenite-wasm = { version = "0.3.1", optional = true }
futures = { version = "0.3", optional = true }

# Native executor for the iroh driver + the `ws` pump tasks. Native-only, so a wasm
# `ws` build pulls the browser executor (below) instead of tokio's rt (which does not
# build for wasm32).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

# Browser executor for the `ws` pump tasks on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { version = "0.4", optional = true }

[features]
default = []
# Real network transport (Iroh QUIC) + tokio driver.
iroh = ["dep:iroh", "dep:iroh-gossip", "dep:tokio", "dep:futures-lite"]
# WebSocket transport (browser session + native WS-relay client). Sans-Iroh, wasm-clean.
ws = ["dep:tokio-tungstenite-wasm", "dep:futures", "dep:tokio", "dep:wasm-bindgen-futures"]

[dev-dependencies]
# Native WS-relay server + async runtime for the `ws` round-trip test.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["handshake"] }
futures = "0.3"

[[example]]
name = "chat_room"
required-features = ["iroh"]
